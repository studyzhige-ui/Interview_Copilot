# Frontend nginx config: serves the SPA and proxies the HTTP/SSE API.
# Local development uses Vite's proxy instead.

# Preserve the original protocol when we're chained behind another TLS
# terminator (Caddy / AWS ALB / Cloudflare → this nginx → backend).
# If the inbound request already carries X-Forwarded-Proto we forward that
# value verbatim so the FastAPI HSTS middleware sees "https"; otherwise we
# fall back to whatever scheme this nginx itself accepted ($scheme).
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    ""      $scheme;
    "~^."   $http_x_forwarded_proto;
}

upstream interview_copilot_api {
    server backend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log combined;

    # 500 MiB — fits interview audio (mock-interview transcribe) + multi-file
    # knowledge uploads. Tune down if you don't allow audio.
    client_max_body_size 500M;
    client_body_timeout 120s;

    # ── Baseline security headers ──────────────────────────────────────
    # These are also emitted by the FastAPI middleware in app/main.py;
    # we duplicate them at the edge so a misconfigured app process can't
    # accidentally strip them. ``always`` makes nginx emit them on error
    # responses too (e.g. 502 from upstream timeout) where add_header
    # would otherwise be silently dropped.
    #
    # TLS/HSTS belongs to the deployment ingress, not this local HTTP image.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;

    # ── SPA static ─────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache the hashed asset bundles; the HTML shell is uncached so
    # users always pick up the latest deploy on next page load.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA fallback: any unknown path serves the shell so React Router can
    # handle it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── SSE / streaming: keep the connection open, disable buffering ──
    location ~ ^/api/v1/(chat/[^/]+/turns/[^/]+/events|interview-records/[^/]+/events)$ {
        proxy_pass http://interview_copilot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 600s;
    }

    # Google must return OAuth code/state as query parameters. Never write
    # that protocol callback request line to the edge access log; the backend
    # independently redacts the same exact path from Uvicorn's access log.
    location = /api/v1/integrations/gmail/callback {
        access_log off;
        # Location-level headers replace the server-level set. A same-origin
        # redirect must never send the callback code/state as its Referer.
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "no-store" always;
        proxy_pass http://interview_copilot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── Generic API proxy ──────────────────────────────────────────────
    location /api/v1/ {
        proxy_pass http://interview_copilot_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }
}
