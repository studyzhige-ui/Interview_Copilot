<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Career OS · 简历编辑器</title><link rel="stylesheet" href="vendor/quill.snow.css"><link rel="stylesheet" href="editor.css"></head>
<body><div id="app">
<header class="topbar"><a href="/profile/" class="back">‹ 个人资料</a><div class="docidentity"><input id="doc-name" aria-label="简历名称" value="我的基础简历"><span id="save-state" aria-live="polite">正在打开…</span></div><div class="topactions"><button id="undo" title="撤销 Ctrl+Z">↶ 撤销</button><button id="redo" title="重做 Ctrl+Shift+Z">↷</button><button id="versions">版本</button><button id="preview">预览</button><button id="export" class="primary">导出 ↗</button></div></header>
<div class="workspace"><nav class="rail" aria-label="编辑工具"><button data-tab="content" class="active">☷<span>内容</span></button><button data-tab="templates">▤<span>模板</span></button><button data-tab="layout">☷<span>排版</span></button><button data-tab="agent">✧<span>Agent</span></button><div class="railbottom">career<br><b>os</b></div></nav>
<aside class="inspector"><div id="panel-content" class="toolpanel"><div class="panelheading"><div><small>基础简历 · 独立版本</small><h2>写下你的经历</h2></div><button id="add-section" title="添加模块">＋</button></div><div id="outline"></div><div id="selected-editor"></div></div>
<div id="panel-templates" class="toolpanel" hidden><small>保留全部内容，只改变版式</small><h2>选择你的表达</h2><div id="template-list"></div></div>
<div id="panel-layout" class="toolpanel" hidden><small>A4 · 实时排版</small><h2>每个细节都可调整</h2><label>正文字体<select id="font"><option value="sans">微软雅黑</option><option value="serif">宋体</option></select></label><label>字号 <output id="size-value"></output><input id="size" type="range" min="10" max="16" step="0.5"></label><label>行距 <output id="leading-value"></output><input id="leading" type="range" min="1.2" max="2" step="0.05"></label><label>页边距 <output id="margin-value"></output><input id="margin" type="range" min="12" max="28" step="1"></label><label>模块间距 <output id="gap-value"></output><input id="gap" type="range" min="8" max="30" step="1"></label><label>主题色<input type="color" id="color"></label><button id="fit-page" class="wide">尝试紧凑排版</button><p class="hint">只调整字号、间距与页边距，不删除文字。可以撤销，也可以保留多页。</p></div>
<div id="panel-agent" class="toolpanel" hidden><small>当前上下文 · 这份简历</small><h2>和 Agent 一起编辑</h2><div class="agent-note">这份简历的 UI 编辑、版本与导出已经可以使用。真实模型尚未连接，当前不会生成或改写经历。</div><p class="hint">选中经历后，未来可基于原文润色、压缩或结合岗位 JD 调整。修改将写入同一份简历，并支持撤销。</p><textarea placeholder="例如：把项目经历提前，突出我的研究能力…" disabled></textarea><button disabled class="primary wide">尚未连接模型</button></div>
</aside><main class="canvas"><div class="canvasbar"><span id="context-label">基础简历</span><span class="canvas-hint">点击纸张内容，定位编辑</span><div><button id="zoom-out" aria-label="缩小">−</button><button id="zoom-fit">适合宽度</button><button id="zoom-in" aria-label="放大">＋</button></div></div><div id="paper-scroll"><div id="pages"></div></div><footer class="canvasfooter"><span id="page-count"></span><span id="document-stats"></span><span>资料与已投递版本独立保存</span></footer></main></div>
<div id="toast" role="status" hidden></div><dialog id="dialog"><div class="dialoghead"><h2 id="dialog-title"></h2><button id="close-dialog" aria-label="关闭">×</button></div><div id="dialog-body"></div></dialog>
</div><script src="vendor/quill.js"></script><script src="editor.js"></script><link rel="stylesheet" href="/shared/design-system.css"><script src="/shared/shell.js"></script></body></html>
