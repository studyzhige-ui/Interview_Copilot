x-backend-build: &backend-build
  context: .
  dockerfile: backend/Dockerfile
  args:
    APP_EXTRAS: ${APP_EXTRAS:-}

x-backend-environment: &backend-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-interview_copilot}
  REDIS_URL: redis://redis:6379/0
  MILVUS_URI: http://milvus-standalone:19530
  AWS_ENDPOINT_URL: http://minio:9000
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}

x-backend-service: &backend-service
  image: interview-copilot-backend:community
  build: *backend-build
  env_file: .env
  environment: *backend-environment
  volumes:
    - ./data:/app/data
  # The shared image defaults to an HTTP API healthcheck. Workers, Beat, and
  # one-shot migrations do not listen on port 8080, so disable it here and
  # opt the API service back in below.
  healthcheck:
    disable: true
  networks:
    - copilot_net

x-runtime-dependencies: &runtime-dependencies
  db:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully
  minio-create-bucket:
    condition: service_completed_successfully

services:
  # Community development stack. The default profile starts infrastructure;
  # `--profile full` also starts the API, workers, scheduler, and frontend.
  # This is not the production Cloud topology.

  db:
    image: postgres:15.18-alpine
    container_name: interview_copilot_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-interview_copilot}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - copilot_net

  redis:
    image: redis:8.8.1-alpine
    container_name: interview_copilot_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - copilot_net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: interview_copilot_minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - copilot_net

  minio-create-bucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: interview_copilot_mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-interview-copilot-bucket}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        /usr/bin/mc alias set myminio http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        /usr/bin/mc mb "myminio/$$S3_BUCKET_NAME" --ignore-existing
    networks:
      - copilot_net

  # Milvus vector database
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: interview_copilot_etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus_etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - copilot_net

  milvus-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: interview_copilot_milvus_minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - milvus_minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - copilot_net

  milvus-standalone:
    image: milvusdb/milvus:v2.6.11
    container_name: interview_copilot_milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    networks:
      - copilot_net

  # ── Optional: full-stack containerized API + Worker + Frontend ──────
  # Activate with: docker compose --profile full up -d
  migrate:
    <<: *backend-service
    profiles: [full]
    container_name: interview_copilot_migrate
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend-service
    profiles: [full]
    container_name: interview_copilot_api
    environment:
      <<: *backend-environment
      # Worker count — 2 is safe with the default DB pool math
      # (2 * 40 = 80 < 100 PG max_connections). Bump together with
      # postgres max_connections + DB_POOL_SIZE if you want more.
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      # The API is reachable only from nginx on the private Compose network.
      # nginx overwrites X-Forwarded-For with one client address, so the app
      # can safely trust its sole upstream without duplicating uvicorn parsing.
      TRUSTED_PROXIES: "*"
    # Multi-worker production launch. --reload is dropped (incompatible
    # with --workers > 1) and --proxy-headers tells uvicorn to honour the
    # X-Forwarded-* headers that the frontend nginx forwards.
    command:
      - sh
      - -c
      - >
        uvicorn app.main:app
        --host 0.0.0.0 --port 8080
        --workers ${UVICORN_WORKERS:-2}
    # No host port — the frontend nginx fronts the API. Uncomment to expose
    # the API directly for curl/Postman against the container.
    # ports:
    #   - "127.0.0.1:8080:8080"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      <<: *runtime-dependencies
      milvus-standalone:
        condition: service_healthy
    # Alias the container DNS as `backend` so frontend nginx upstream resolves.
    hostname: backend

  frontend:
    profiles: [full]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Same-origin deployment: SPA + API behind the one nginx, no absolute URL.
        VITE_API_BASE: /api/v1
    container_name: interview_copilot_frontend
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - copilot_net

  # ── Worker fleet: conversations + voice + indexing + intelligence + control ──
  # Each process subscribes to one workload class so slow ASR, parsing and
  # long Agent turns cannot block one another or load unrelated models.

  worker-turns:
    <<: *backend-service
    profiles: [full]
    container_name: interview_copilot_worker_turns
    environment:
      <<: *backend-environment
      CELERY_QUEUES: "turns"
    command:
      - celery
      - -A
      - app.task_queue.celery_app.celery_app
      - worker
      - --loglevel=info
      - --pool=threads
      - --concurrency=${TURN_WORKER_CONCURRENCY:-2}
      - --queues=turns
      - --hostname=turns@%h
    depends_on:
      <<: *runtime-dependencies
      milvus-standalone:
        condition: service_healthy

  worker-transcription:
    <<: *backend-service
    profiles: [full]
    container_name: interview_copilot_worker_transcription
    environment:
      <<: *backend-environment
      # Belt-and-braces signal in addition to --queues; init_worker_models
      # checks this env var first when deciding whether to load Whisper.
      CELERY_QUEUES: "transcription"
    command:
      - celery
      - -A
      - app.task_queue.celery_app.celery_app
      - worker
      - --loglevel=info
      - --pool=solo
      - --queues=transcription
      - --hostname=transcription@%h
    depends_on:
      <<: *runtime-dependencies

  worker-pipeline:
    <<: *backend-service
    profiles: [full]
    container_name: interview_copilot_worker_pipeline
    environment:
      <<: *backend-environment
      CELERY_QUEUES: "pipeline"
    command:
      - celery
      - -A
      - app.task_queue.celery_app.celery_app
      - worker
      - --loglevel=info
      - --pool=solo
      - --queues=pipeline
      - --hostname=pipeline@%h
    depends_on:
      <<: *runtime-dependencies
      milvus-standalone:
        condition: service_healthy

  worker-background:
    <<: *backend-service
    profiles: [full]
    container_name: interview_copilot_worker_background
    environment:
      <<: *backend-environment
      CELERY_QUEUES: "background"
    command:
      - celery
      - -A
      - app.task_queue.celery_app.celery_app
      - worker
      - --loglevel=info
      - --pool=threads
      - --concurrency=${BACKGROUND_WORKER_CONCURRENCY:-2}
      - --queues=background
      - --hostname=background@%h
    depends_on:
      <<: *runtime-dependencies

  worker-light:
    <<: *backend-service
    profiles: [full]
    container_name: interview_copilot_worker_light
    environment:
      <<: *backend-environment
      CELERY_QUEUES: "default"
    command:
      - celery
      - -A
      - app.task_queue.celery_app.celery_app
      - worker
      - --loglevel=info
      # Control, cleanup and scheduled jobs are short I/O operations; long
      # model-backed review/memory work runs on worker-background.
      - --pool=threads
      - --concurrency=4
      - --queues=default
      - --hostname=light@%h
    depends_on:
      <<: *runtime-dependencies

  # Celery Beat — fires the nightly dreaming scan at 03:30 Asia/Shanghai.
  # Sends tasks to the queue specified by task_routes. Beat itself does no
  # work; one instance is sufficient.
  beat:
    <<: *backend-service
    profiles: [full]
    container_name: interview_copilot_beat
    command:
      - celery
      - -A
      - app.task_queue.celery_app.celery_app
      - beat
      - --loglevel=info
      - --schedule=/app/data/runtime/celerybeat-schedule
    depends_on:
      <<: *runtime-dependencies

volumes:
  minio_data:
  pgdata:
  redis_data:
  milvus_etcd:
  milvus_minio:
  milvus_data:

networks:
  copilot_net:
    driver: bridge
