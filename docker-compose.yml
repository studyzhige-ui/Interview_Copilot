x-backend-build: &backend-build
  context: .
  dockerfile: backend/Dockerfile
  args:
    APP_EXTRAS: ${APP_EXTRAS:-}

x-backend-environment: &backend-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-interview_copilot}
  REDIS_URL: redis://redis:6379/0
  STORAGE_BACKEND: ${STORAGE_BACKEND:-filesystem}
  STORAGE_DIR: /app/data/storage
  STORAGE_MIN_FREE_BYTES: ${STORAGE_MIN_FREE_BYTES:-67108864}
  AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-}

x-backend-service: &backend-service
  image: interview-copilot-backend:community
  build: *backend-build
  env_file: .env
  environment: *backend-environment
  volumes:
    - ./data:/app/data
  # Role-specific health checks belong to the API/DB/Redis services below.
  # Workers and Beat are running services, not HTTP servers; migrations must
  # finish successfully before their dependents may start.
  networks:
    - copilot_net

x-runtime-dependencies: &runtime-dependencies
  db:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  # Community development stack. The default profile starts infrastructure;
  # `--profile full` also starts the API, workers, scheduler, and frontend.
  # This is not the production Cloud topology.

  db:
    image: interview-copilot-postgres:15-pgvector-0.8.6
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
    container_name: interview_copilot_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-interview_copilot}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - copilot_net

  redis:
    image: redis:8.10.0-alpine
    container_name: interview_copilot_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - copilot_net

  # Canonical schema and pgvector extension migration
  migrate:
    <<: *backend-service
    profiles: [full]
    container_name: interview_copilot_migrate
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend-service
    profiles: [full]
    container_name: interview_copilot_api
    environment:
      <<: *backend-environment
      # Worker count — 2 is safe with the default DB pool math
      # (2 * 40 = 80 < 100 PG max_connections). Bump together with
      # postgres max_connections + DB_POOL_SIZE if you want more.
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      # The API is reachable only from nginx on the private Compose network.
      # nginx overwrites X-Forwarded-For with one client address, so the app
      # can safely trust its sole upstream without duplicating uvicorn parsing.
      TRUSTED_PROXIES: "*"
    # Multi-worker production launch. --reload is dropped (incompatible
    # with --workers > 1) and --proxy-headers tells uvicorn to honour the
    # X-Forwarded-* headers that the frontend nginx forwards.
    command:
      - sh
      - -c
      - >
        uvicorn app.main:app
        --host 0.0.0.0 --port 8080
        --workers ${UVICORN_WORKERS:-2}
    # No host port — the frontend nginx fronts the API. Uncomment to expose
    # the API directly for curl/Postman against the container.
    # ports:
    #   - "127.0.0.1:8080:8080"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      <<: *runtime-dependencies
    # Alias the container DNS as `backend` so frontend nginx upstream resolves.
    hostname: backend
    networks:
      copilot_net:
        aliases: [backend]

  frontend:
    profiles: [full]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Same-origin deployment: SPA + API behind the one nginx, no absolute URL.
        VITE_API_BASE: /api/v1
    container_name: interview_copilot_frontend
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - copilot_net

  # ── Worker fleet: conversations + voice + indexing + intelligence + control ──
  # Each process subscribes to one workload class so slow ASR, parsing and
  # long Agent turns cannot block one another or load unrelated models.

  worker-turns:
    <<: *backend-service
    profiles: [full]
    container_name: interview_copilot_worker_turns
    environment:
      <<: *backend-environment
      CELERY_QUEUES: "turns"
    command:
      - celery
      - -A
      - app.task_queue.celery_app.celery_app
      - worker
      - --loglevel=info
      - --pool=threads
      - --concurrency=${TURN_WORKER_CONCURRENCY:-2}
      - --queues=turns
      - --hostname=turns@%h
    depends_on:
      <<: *runtime-dependencies

  worker-transcription:
    <<: *backend-service
    profiles: [full]
    container_name: interview_copilot_worker_transcription
    environment:
      <<: *backend-environment
      # Belt-and-braces signal in addition to --queues; init_worker_models
      # checks this env var first when deciding whether to load Whisper.
      CELERY_QUEUES: "transcription"
    command:
      - celery
      - -A
      - app.task_queue.celery_app.celery_app
      - worker
      - --loglevel=info
      - --pool=solo
      - --queues=transcription
      - --hostname=transcription@%h
    depends_on:
      <<: *runtime-dependencies

  worker-pipeline:
    <<: *backend-service
    profiles: [full]
    container_name: interview_copilot_worker_pipeline
    environment:
      <<: *backend-environment
      CELERY_QUEUES: "pipeline"
    command:
      - celery
      - -A
      - app.task_queue.celery_app.celery_app
      - worker
      - --loglevel=info
      - --pool=solo
      - --queues=pipeline
      - --hostname=pipeline@%h
    depends_on:
      <<: *runtime-dependencies

  worker-jobs:
    <<: *backend-service
    profiles: [full]
    container_name: interview_copilot_worker_jobs
    environment:
      <<: *backend-environment
      # Community topology: retain separate logical lanes while sharing one
      # lightweight process. Heavy local AI runtimes remain isolated in the
      # turns, transcription and pipeline workers.
      CELERY_QUEUES: "background,default"
    command:
      - celery
      - -A
      - app.task_queue.celery_app.celery_app
      - worker
      - --loglevel=info
      - --pool=threads
      - --concurrency=${JOB_WORKER_CONCURRENCY:-4}
      - --queues=background,default
      - --hostname=jobs@%h
    depends_on:
      <<: *runtime-dependencies

  # Celery Beat dispatches the periodic catalog and maintenance jobs declared
  # in task_routes. Beat itself does no work; one instance is sufficient.
  beat:
    <<: *backend-service
    profiles: [full]
    container_name: interview_copilot_beat
    command:
      - celery
      - -A
      - app.task_queue.celery_app.celery_app
      - beat
      - --loglevel=info
      - --schedule=/app/data/runtime/celerybeat-schedule
    depends_on:
      <<: *runtime-dependencies

volumes:
  # Retained declaration only: no MinIO service is started or old data removed.
  minio_data:
  pgdata:
  redis_data:

networks:
  copilot_net:
    driver: bridge
