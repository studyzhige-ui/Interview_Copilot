[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-copilot"
version = "0.1.0"
description = "AI interview copilot — mock interviews, review analysis, RAG knowledge base, and long-term memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web
    "fastapi==0.135.2",
    "uvicorn==0.42.0",
    "gunicorn==23.0.0",
    "python-multipart==0.0.22",
    "websockets==15.0.1",
    # Persistence and background work
    "sqlalchemy==2.0.48",
    "psycopg2-binary==2.9.11",
    "alembic==1.17.2",
    "redis==5.2.1",
    "celery==5.6.3",
    "boto3==1.38.0",
    "pymilvus==2.6.11",
    # Configuration and security
    "python-dotenv==1.2.2",
    "pydantic[email]==2.12.5",
    "pydantic-settings==2.13.1",
    "python-jose[cryptography]==3.5.0",
    "cryptography==44.0.1",
    "pwdlib[argon2,bcrypt]==0.3.0",
    "nest_asyncio==1.6.0",
    "slowapi==0.1.9",
    # LLM and remote RAG providers
    "openai==2.30.0",
    "tiktoken==0.12.0",
    "langsmith==0.7.22",
    "transformers==4.48.0",
    "huggingface-hub==0.28.1",
    "llama-index-core==0.14.19",
    "llama-index-llms-openai==0.6.26",
    "llama-index-llms-openai-like==0.5.3",
    "llama-index-embeddings-openai==0.6.0",
    "llama-index-embeddings-openai-like==0.3.1",
    # Documents
    "llama-index-readers-file==0.6.0",
    "pypdf==6.9.2",
    "pymupdf==1.27.2.2",
    "llama-parse==0.6.94",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "openpyxl==3.1.5",
    "beautifulsoup4==4.12.3",
    "charset-normalizer==3.3.2",
    "tree-sitter==0.25.2",
    "tree-sitter-language-pack==1.8.1",
    # Agent capabilities
    "httpx==0.28.1",
    "markdownify==1.1.0",
    "mcp==1.27.1",
    "PyYAML==6.0.2",
    "jsonschema==4.23.0",
    "edge-tts==7.2.8",
]

[project.optional-dependencies]
community = [
    # Local embeddings, reranking, parsing, OCR, speech, and diarization
    "sentence-transformers==5.1.2",
    "llama-index-embeddings-huggingface==0.7.0",
    "llama-index-postprocessor-sbert-rerank==0.5.0",
    "docling==2.100.0",
    "rapidocr-onnxruntime==1.2.3",
    "faster-whisper==1.2.1",
    "whisperx==3.8.4",
    "torch==2.8.0+cu129",
    "torchvision==0.23.0+cu129",
    "torchaudio==2.8.0+cu129",
]
dev = [
    # Evaluation, tests, and static analysis
    "datasets==4.8.4",
    "ragas==0.4.3",
    "langchain-openai==1.1.12",
    "pytest==8.4.2",
    "pytest-asyncio==1.1.0",
    "ruff==0.15.12",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
# "backend" makes ``app.*`` importable; "." makes ``scripts.*`` importable
# (test_scripts/ imports the ops scripts at the repo root).
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests that require significant time (e.g. model loading)",
    "integration: marks tests that require external services (DB, Milvus, Redis)",
]
filterwarnings = [
    "ignore::DeprecationWarning:sqlalchemy",
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
]
