[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-copilot"
version = "0.1.0"
description = "Local-first career copilot for job search, interviews, artifacts, and agent workflows"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Web
    "fastapi==0.143.1",
    "uvicorn==0.54.0",
    "gunicorn==26.2.0",
    "python-multipart==0.0.32",
    # Persistence and background work
    "sqlalchemy==2.1.4",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
    "redis==8.1.0",
    "celery==5.6.3",
    "boto3==1.43.114",
    # PostgreSQL vector projection; local ML libraries stay in their own environment.
    "pgvector==0.5.1",
    # Optional Chinese lexical profile runs in API/worker, outside the ML child.
    "jieba==0.42.1",
    # Configuration and security
    "python-dotenv==1.2.4",
    "pydantic[email]==2.14.1",
    "pydantic-settings==2.16.0",
    "PyJWT==2.15.1",
    "cryptography==50.0.2",
    # Runtime plugin and Gmail credential-store locking
    "filelock==4.2.0",
    "pwdlib[argon2,bcrypt]==0.3.1",
    "nest_asyncio==1.6.0",
    "slowapi==0.1.10",
    # LLM and remote RAG providers
    "openai==2.54.0",
    "anthropic==1.14.0",
    "tiktoken==0.14.0",
    "langsmith==0.14.8",
    "llama-index-core==0.14.25",
    "llama-index-llms-openai==0.8.3",
    "llama-index-llms-openai-like==0.8.1",
    "llama-index-embeddings-openai==0.6.0",
    "llama-index-embeddings-openai-like==0.4.0",
    # Documents
    "llama-index-readers-file==0.7.0",
    "pypdf==6.20.1",
    "pymupdf==1.28.2",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "openpyxl==3.1.5",
    "beautifulsoup4==4.15.0",
    "charset-normalizer==3.5.2",
    "tree-sitter==0.26.0",
    # Installed native grammars: no lazy network download during code ingestion.
    "tree-sitter-python==0.25.0",
    "tree-sitter-java==0.23.5",
    "tree-sitter-cpp==0.23.4",
    "tree-sitter-c==0.24.2",
    # Agent capabilities
    "httpx==0.28.1",
    "markdownify==1.2.3",
    "mcp==2.3.0",
    "PyYAML==6.0.3",
    "jsonschema==4.26.0",
    "edge-tts==7.3.1",
]

[project.optional-dependencies]
local = [
    # Local embeddings, reranking, parsing, OCR, speech, and diarization
    # WhisperX 3.8 requires huggingface-hub<1, so Transformers 5.x is not a
    # resolvable upgrade until WhisperX moves to the Hub 1.x line.
    "transformers==4.57.6",
    "huggingface-hub==0.36.2",
    "sentence-transformers==5.7.0",
    "docling[rapidocr]==2.139.0",
    "rapidocr==3.10.0",
    "faster-whisper==1.2.1",
    "whisperx==3.8.6",
    "nltk==3.10.3",
    # WhisperX requires torch~=2.8.0 and torchcodec<0.8. Keep the matching
    # TorchCodec ABI rather than independently upgrading native extensions.
    "torchcodec==0.7.0",
]
cuda = [
    # Optional NVIDIA runtime; keep platform-specific wheels out of the
    # portable Community dependency set.
    "torch==2.8.0+cu129",
    "torchvision==0.23.0+cu129",
    "torchaudio==2.8.0+cu129",
]
dev = [
    # Tests and static analysis
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    # Keep the lint contract explicit below so Ruff upgrades do not silently
    # enable unrelated rule families.
    "ruff==0.17.0",
]
evaluation = [
    # Optional offline evaluation only: use a separate environment, never the
    # API/worker image. Ragas and its compatible LangChain line still have
    # published advisories; see the dependency upgrade acceptance report.
    "ragas==0.4.3",
    # Ragas 0.4.3 imports the pre-1.0 LangChain community module layout.
    # Pin the newest coherent 0.3 line instead of the incompatible 1.x/0.4 pair.
    "langchain-community==0.3.31",
    "langchain-openai==0.3.35",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.package-data]
"app.providers.catalog" = ["seed_catalog.json"]
"app.conversation" = ["context_templates/*.md", "context_templates/LICENSE", "context_templates/NOTICE"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
# "backend" makes ``app.*`` importable; "." makes ``scripts.*`` importable
# (test_scripts/ imports the ops scripts at the repo root).
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests that require significant time (e.g. model loading)",
    "integration: marks tests that require external services (PostgreSQL, Redis)",
]
filterwarnings = [
    "ignore::DeprecationWarning:sqlalchemy",
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
