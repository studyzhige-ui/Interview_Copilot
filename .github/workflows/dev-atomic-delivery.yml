name: Fixed repo-side integration delivery
on:
  push:
    branches: [dev/source-export-20260921]
    paths: [.github/workflows/dev-atomic-delivery.yml, .delivery/**]
permissions:
  contents: read
jobs:
  verify-and-publish-objects:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      REQUIRE_WEBRTC: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply fixed source batch without moving a branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/copilot-delivery"
          cp .delivery/* "$RUNNER_TEMP/copilot-delivery/"
          python "$RUNNER_TEMP/copilot-delivery/stage.py" prepare
      - name: Install validation dependencies, never model weights
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install -e '.[dev]' 'aiortc==1.15.0'
          npm --prefix frontend ci
          npm --prefix scripts/contract_codegen ci
      - name: Validate source contracts and static gates
        run: |
          set -euo pipefail
          ruff format --check backend/app backend/tests evaluation scripts
          ruff check backend/app backend/tests evaluation scripts
          python -m compileall -q backend/app scripts
          python scripts/export_shared_contracts.py --check
          python scripts/export_realtime_contracts.py --check
          npm --prefix scripts/contract_codegen run check
          npm --prefix frontend run typecheck
          npm --prefix frontend run lint
          npm --prefix frontend run build
      - name: Combined backend, document and native transport campaign
        run: |
          set -euo pipefail
          pytest backend/tests/test_services/interview backend/tests/test_services/resume backend/tests/test_rag backend/tests/test_architecture backend/tests/test_agent_runtime backend/tests/test_local_inference backend/tests/test_realtime backend/tests/test_core/test_model_assets.py backend/tests/test_services/test_mutation_refresh.py backend/tests/test_services/test_personalization_service.py backend/tests/test_services/test_agent_memory_service.py backend/tests/test_services/test_memory_pipeline.py backend/tests/test_services/test_artifact_service.py backend/tests/test_services/test_offer_service.py backend/tests/test_services/test_career_process_service.py backend/tests/test_services/test_career_profile_service.py backend/tests/test_services/test_persistent_task_service.py -q --disable-warnings --junitxml="$RUNNER_TEMP/copilot-delivery/backend.xml" > "$RUNNER_TEMP/copilot-delivery/backend.log" 2>&1 || { tail -100 "$RUNNER_TEMP/copilot-delivery/backend.log"; exit 1; }
          tail -8 "$RUNNER_TEMP/copilot-delivery/backend.log"
      - name: Full frontend regression campaign
        run: |
          set -euo pipefail
          npm --prefix frontend test -- --run --maxWorkers=2 > "$RUNNER_TEMP/copilot-delivery/frontend.log" 2>&1 || { tail -100 "$RUNNER_TEMP/copilot-delivery/frontend.log"; exit 1; }
          tail -10 "$RUNNER_TEMP/copilot-delivery/frontend.log"
      - name: Publish validated immutable Git objects only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python "$RUNNER_TEMP/copilot-delivery/stage.py" publish
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: repo-side-delivery
          path: |
            ${{ runner.temp }}/copilot-delivery/result.json
            ${{ runner.temp }}/copilot-delivery/backend.log
            ${{ runner.temp }}/copilot-delivery/backend.xml
            ${{ runner.temp }}/copilot-delivery/frontend.log
          retention-days: 2
          if-no-files-found: warn
