name: Publish verified local-first batch
on:
  push:
    branches: [refactor/product-runtime-convergence]
    paths: [.github/workflows/local-first-apply.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'studyzhige-ui/Interview_Copilot' && github.ref == 'refs/heads/refactor/product-runtime-convergence'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Verify and apply exact tested source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = c9cde5950da9ac42dafb72e91eb31466a838ae04
          test "$(git ls-remote origin refs/heads/refactor/product-runtime-convergence | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          import base64, hashlib, lzma, os
          from pathlib import Path
          chunks = [Path(f'.local-first-transfer/{n:02d}.txt') for n in range(1, 8)]
          encoded = ''.join(p.read_text(encoding='ascii') for p in chunks)
          assert len(encoded) == 48760
          packed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(packed).hexdigest() == '48f99562ce7bc2e443c5dd90f3149912676dd7e0d94b9b81683e81271221782a'
          decoder = lzma.LZMADecompressor(memlimit=128 * 1024 * 1024)
          patch = decoder.decompress(packed, max_length=1024 * 1024)
          assert decoder.eof and not decoder.unused_data
          assert len(patch) == 149588
          assert hashlib.sha256(patch).hexdigest() == 'e36a95d02aec2bc55cd7433a40ea1aefd882c54e5cb3af34c1207cf0517013a3'
          Path(os.environ['RUNNER_TEMP'], 'local-first.patch').write_bytes(patch)
          PY
          git apply --index --check "$RUNNER_TEMP/local-first.patch"
          git apply --index "$RUNNER_TEMP/local-first.patch"
          git rm .github/workflows/local-first-apply.yml .local-first-transfer/*.txt
          test "$(git write-tree)" = 365267897d3a7c2d8f9a2c364afcc41447d8dc45
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: start local-first rebuild with strict evaluation and model preflight'
          test "$(git ls-remote origin refs/heads/refactor/product-runtime-convergence | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/refactor/product-runtime-convergence
