name: Refactor exact source export
on:
  push:
    branches: [refactor/product-runtime-convergence]
    paths: [.github/workflows/refactor-source-export.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 45ebb5044f3afc412708509fa72d74166fc98345
          persist-credentials: false
      - name: Export tracked source only
        run: |
          test "$(git rev-parse HEAD)" = '45ebb5044f3afc412708509fa72d74166fc98345'
          git archive --format=tar.gz -o "$RUNNER_TEMP/copilot-source-45ebb504.tar.gz" HEAD
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/source-identity.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: copilot-source-45ebb504
          path: |
            ${{ runner.temp }}/copilot-source-45ebb504.tar.gz
            ${{ runner.temp }}/source-identity.txt
          retention-days: 3
          if-no-files-found: error
