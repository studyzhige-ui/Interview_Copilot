name: Publish verified recovery tree
on:
  push:
    branches: [refactor/product-runtime-convergence]
    paths: [.github/workflows/refactor-finish-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'studyzhige-ui/Interview_Copilot' && github.ref == 'refs/heads/refactor/product-runtime-convergence'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify immutable transport and all source preimages
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '782902f747809e7aa3676db17a191243a198ada4'
          git fetch origin refs/heads/refactor/product-runtime-convergence
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import base64, hashlib, json, zlib
          from pathlib import Path
          encoded = ''.join(Path(f'.refactor-finish/{n:02}.b64').read_text() for n in range(1,5))
          # Repair one known transcription insertion before checking the exact
          # original digest. No altered or merely parseable payload is accepted.
          encoded = encoded.replace('RXbxZZq', 'RXbxZq')
          assert hashlib.sha256(encoded.encode()).hexdigest() == 'ac98e2989527ba736da1f057189665a95f20afb90fcf8cfb3e8217f215d7ea9a', 'transport checksum mismatch'
          records = json.loads(zlib.decompress(base64.b64decode(encoded, validate=True)))
          pending = {}
          for name, before_hash, after_hash, edits in records:
              p = Path(name)
              assert not p.is_absolute() and not {'.git','..'} & set(p.parts)
              assert name not in pending and all(not q.is_symlink() for q in [p,*p.parents])
              before = p.read_bytes() if p.exists() else b''
              assert hashlib.sha256(before).hexdigest() == before_hash, ('preimage mismatch', name)
              lines = before.decode().splitlines(keepends=True)
              end = len(lines)
              for start, stop, replacement in reversed(edits):
                  assert 0 <= start <= stop <= end
                  lines[start:stop] = [replacement]
                  end = start
              after = ''.join(lines).encode()
              assert hashlib.sha256(after).hexdigest() == after_hash, ('target mismatch', name)
              pending[name] = after
          assert len(pending) == 27
          for name, content in pending.items():
              p = Path(name)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(content)
          print('Verified every changed source byte against local regression tree.')
          PY
      - name: Remove helpers and publish only the exact reviewed source tree
        run: |
          set -euo pipefail
          git rm -r .refactor-finish .github/workflows/refactor-finish-apply.yml .github/workflows/refactor-workspace.yml .github/workflows/refactor-infra.yml
          git add -A
          actual=$(git write-tree)
          echo "Actual source tree: $actual"
          test "$actual" = '88e4054a18c383f37e59ab4968eabb694c5774ee'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: recover invitation turns under real worker failure and add production browser campaign'
          git push origin HEAD:refs/heads/refactor/product-runtime-convergence
