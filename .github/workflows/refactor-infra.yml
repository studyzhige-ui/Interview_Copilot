name: Isolated refactor test runtimes
on:
  push:
    branches: [refactor/product-runtime-convergence]
    paths: [.github/workflows/refactor-infra.yml]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install public test service binaries only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16 redis-server
      - name: Package relocatable binaries without databases or credentials
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/runtime/usr/lib/postgresql" "${RUNNER_TEMP}/runtime/usr/share/postgresql" "${RUNNER_TEMP}/runtime/usr/bin" "${RUNNER_TEMP}/runtime/lib"
          cp -a /usr/lib/postgresql/16 "${RUNNER_TEMP}/runtime/usr/lib/postgresql/"
          cp -a /usr/share/postgresql/16 "${RUNNER_TEMP}/runtime/usr/share/postgresql/"
          cp -L /usr/bin/redis-server /usr/bin/redis-cli "${RUNNER_TEMP}/runtime/usr/bin/"
          rm -rf "${RUNNER_TEMP}/runtime/usr/lib/postgresql/16/lib/bitcode"
          python3 - <<'PY'
          import os, pathlib, re, shutil, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'runtime'
          binaries = list((root/'usr/lib/postgresql/16/bin').glob('*')) + list((root/'usr/lib/postgresql/16/lib').glob('*.so')) + list((root/'usr/bin').glob('*'))
          omitted = {'libc.so.6','libm.so.6','libpthread.so.0','librt.so.1','libdl.so.2','libresolv.so.2','libutil.so.1'}
          for binary in binaries:
              result = subprocess.run(['ldd', str(binary)], capture_output=True, text=True, check=False)
              for path in re.findall(r'=> (/[^\s]+)', result.stdout):
                  src = pathlib.Path(path)
                  if src.name not in omitted:
                      shutil.copyfile(src.resolve(), root/'lib'/src.name)
          (root/'versions.txt').write_text(subprocess.check_output(['/usr/lib/postgresql/16/bin/postgres','--version'], text=True) + subprocess.check_output(['/usr/bin/redis-server','--version'], text=True))
          PY
          tar -C "${RUNNER_TEMP}/runtime" -czf "${RUNNER_TEMP}/test-runtimes.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-test-runtimes
          path: ${{ runner.temp }}/test-runtimes.tar.gz
          retention-days: 1
