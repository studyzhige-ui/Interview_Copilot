name: Publish checked local audio implementation
on:
  push:
    branches: [refactor/product-runtime-convergence]
    paths: [.github/workflows/refactor-apply-audio.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Check exact source bytes and stage only declared files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^)" = 'e9264171092e1dd6434fe2c5fba362d6534a74a7'
          python - <<'PY'
          import bz2, hashlib, json, subprocess
          from pathlib import Path, PurePosixPath
          root = Path.cwd()
          data = b''.join((root / '.refactor-audio-transfer' / f'part-{i:02d}.bin').read_bytes() for i in range(4))
          if len(data) != 18850 or hashlib.sha256(data).hexdigest() != '5baf889586aa5c66f54c66c6a7b83b344a85b9d373bf469a8bad8eef0bfe7bca':
              raise SystemExit('source transport identity mismatch')
          decoder = bz2.BZ2Decompressor()
          raw = decoder.decompress(data, max_length=100000)
          if not decoder.eof or decoder.unused_data or len(raw) != 66457 or hashlib.sha256(raw).hexdigest() != '361ce45d044902dc85a0b1007fcf61adc8ae16e8e7830b77e9aa2e0b617e3688':
              raise SystemExit('source manifest identity mismatch')
          operations = json.loads(raw)
          if not isinstance(operations, dict) or len(operations) != 25:
              raise SystemExit('unexpected operation count')
          prepared = []
          for name, (before_hash, after_hash, edits) in operations.items():
              path = PurePosixPath(name)
              if path.is_absolute() or '..' in path.parts or path.parts[0] not in {'backend','docs','scripts'}:
                  raise SystemExit('unsafe source path')
              target = root.joinpath(*path.parts)
              if any(p.is_symlink() for p in (target,*target.parents)):
                  raise SystemExit('source symlink refused')
              stored = subprocess.run(['git','show','HEAD:' + name], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
              before = stored.stdout if stored.returncode == 0 else None
              actual = hashlib.sha256(before).hexdigest() if before is not None else None
              if actual != before_hash:
                  raise SystemExit('source preimage mismatch: ' + name)
              lines = (before or b'').decode('utf-8').splitlines(keepends=True)
              upper = len(lines)
              for start, stop, replacement in reversed(edits):
                  if type(start) is not int or type(stop) is not int or not 0 <= start <= stop <= upper or not isinstance(replacement,str):
                      raise SystemExit('invalid source edit')
                  lines[start:stop] = replacement.splitlines(keepends=True)
                  upper = start
              result = ''.join(lines).encode('utf-8') if after_hash is not None else None
              actual = hashlib.sha256(result).hexdigest() if result is not None else None
              if actual != after_hash:
                  raise SystemExit('source postimage mismatch: ' + name)
              prepared.append((name,target,result,after_hash))
          for name,target,result,expected in prepared:
              if result is None:
                  target.unlink()
              else:
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(result)
          subprocess.run(['git','add','--',*operations],check=True)
          staged = set(filter(None,subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')))
          if staged != set(operations):
              raise SystemExit('unexpected staged paths')
          for name,target,result,expected in prepared:
              if result is not None:
                  index = subprocess.check_output(['git','show',':' + name])
                  if hashlib.sha256(index).hexdigest() != expected:
                      raise SystemExit('index bytes differ from tested source: ' + name)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          print('25 exact source changes verified. No models, project code, Secrets or migrations executed.')
          PY
      - name: Commit only to unchanged refactor branch
        shell: bash
        run: |
          set -euo pipefail
          branch='refactor/product-runtime-convergence'
          test "$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add finite Qwen audio inference and fault-safe resource scheduling' -m '25 hash-verified source changes: bounded PCM decoding, isolated ASR/aligner roles, short-clip integration, queued deadlines and sticky cleanup errors. Actual weights, streaming voice and full diarized Qwen review are not claimed verified. Fresh CI follows.'
          git push origin "HEAD:refs/heads/$branch"
          printf 'Published source commit: %s\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
