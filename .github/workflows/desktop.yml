name: Desktop acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-package:
    # Standard hosted runners are free for this public repository. Do not turn
    # a future private-repository run into an unapproved paid Windows job.
    if: github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      IC_SUPABASE_URL: https://fixture.supabase.co
      IC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_synthetic_fixture
      IC_SUPABASE_EMAIL_DELIVERY: team_only
      IC_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      IC_DESKTOP_ACCEPTANCE: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install pinned desktop build dependencies
        run: npm ci --prefix desktop --no-audit --no-fund
      - name: Run native boundary and lifecycle policy tests
        run: npm test --prefix desktop
      - name: Build validation-only Windows installer
        run: npm run package:win --prefix desktop -- -c.artifactName=Interview-Copilot-acceptance-fixture.exe
      - name: Inspect installer and bundled source integrity
        run: node desktop/scripts/verify-package.cjs --installer
      - name: Verify installed Windows protocol and single-instance dispatch
        shell: pwsh
        run: ./desktop/scripts/test-windows-dispatch.ps1
      - name: Preserve OS dispatch report even when acceptance fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-dispatch-evidence
          path: desktop/release/windows-dispatch-report.json
          if-no-files-found: warn
          retention-days: 1
      - name: Preserve validation-only package evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-validation-only
          path: |
            desktop/release/Interview-Copilot-acceptance-fixture.exe
            desktop/release/acceptance-report.json
            desktop/release/VALIDATION-ONLY.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  docker-runtime:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      IC_SUPABASE_URL: https://fixture.supabase.co
      IC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_synthetic_fixture
      IC_DESKTOP_ACCEPTANCE: "1"
      IC_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Assemble the exact installed runtime sources
        run: node desktop/scripts/prepare-runtime.cjs
      - name: Exercise the owned Docker stack and retained data
        run: node desktop/scripts/test-docker-runtime.cjs
      - name: Preserve runtime acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-docker-runtime-evidence
          path: desktop/runtime-acceptance.json
          if-no-files-found: warn
          retention-days: 1
