name: Desktop acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-package:
    # Standard hosted runners are free for this public repository. Do not turn
    # a future private-repository run into an unapproved paid Windows job.
    if: github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      IC_SUPABASE_URL: https://fixture.supabase.co
      IC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_synthetic_fixture
      IC_SUPABASE_EMAIL_DELIVERY: team_only
      IC_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      IC_DESKTOP_ACCEPTANCE: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install pinned desktop build dependencies
        run: npm ci --prefix desktop --no-audit --no-fund
      - name: Run native boundary and lifecycle policy tests
        run: npm test --prefix desktop
      - name: Parse the Windows launch and acceptance scripts
        shell: pwsh
        run: |
          foreach ($script in @('scripts/setup.ps1', 'scripts/start.ps1', 'desktop/scripts/test-windows-dispatch.ps1')) {
            $parseTokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $script), [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - name: Build validation-only Windows installer
        run: node desktop/scripts/build-acceptance.cjs
      - name: Inspect installer and bundled source integrity
        run: node desktop/scripts/verify-package.cjs --installer
      - name: Verify installed Windows protocol and single-instance dispatch
        shell: pwsh
        run: ./desktop/scripts/test-windows-dispatch.ps1
      - name: Preserve OS dispatch report even when acceptance fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-dispatch-evidence
          path: desktop/release/windows-dispatch-report.json
          if-no-files-found: warn
          retention-days: 1
      - name: Preserve validation-only package evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-validation-only
          path: |
            desktop/release/Interview-Copilot-acceptance-fixture.exe
            desktop/release/acceptance-report.json
            desktop/release/VALIDATION-ONLY.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  optional-s3-http:
    # Compatibility fixture only; never part of the shipped desktop stack.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      seaweedfs:
        # Official SeaweedFS 4.48 linux/amd64 descriptor, verified via Registry API.
        image: chrislusf/seaweedfs@sha256:aba492e2a4e4c90bff795745e8e660affa1f09e7650f5981bd7bccd1a06cd931
        options: --platform linux/amd64
        ports:
          - 127.0.0.1:8333:8333
        env:
          AWS_ACCESS_KEY_ID: copilot-ci-fixture-access
          AWS_SECRET_ACCESS_KEY: copilot-ci-fixture-secret
    env:
      PYTHONPATH: backend
      REQUIRE_TEST_S3: "1"
      TEST_S3_ENDPOINT: http://127.0.0.1:8333
      TEST_S3_ACCESS_KEY_ID: copilot-ci-fixture-access
      TEST_S3_SECRET_ACCESS_KEY: copilot-ci-fixture-secret
      TEST_S3_BUCKET: copilot-acceptance
      SECRET_KEY: ci-s3-only-synthetic-secret-not-for-production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install application and protocol-test dependencies
        run: pip install -e ".[dev]"
      - name: Verify the pinned local S3 fixture is ready
        env:
          S3_FIXTURE_CONTAINER: ${{ job.services.seaweedfs.id }}
        run: |
          mkdir -p test-results
          docker inspect --format '{{json .Config.Image}}' "$S3_FIXTURE_CONTAINER" > test-results/s3-image.json
          python - <<'PY'
          import os, time, boto3, urllib.request, urllib.error
          from botocore.config import Config
          client = boto3.client('s3', endpoint_url=os.environ['TEST_S3_ENDPOINT'], aws_access_key_id=os.environ['TEST_S3_ACCESS_KEY_ID'], aws_secret_access_key=os.environ['TEST_S3_SECRET_ACCESS_KEY'], region_name='us-east-1', config=Config(signature_version='s3v4', connect_timeout=1, read_timeout=1, retries={'max_attempts': 0}, s3={'addressing_style':'path'}))
          for attempt in range(60):
              try:
                  client.list_buckets()
                  print('Authenticated disposable S3-compatible fixture ready')
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise RuntimeError('Disposable S3-compatible fixture did not become ready')
          try:
              with urllib.request.urlopen(os.environ['TEST_S3_ENDPOINT'] + '/', timeout=3):
                  raise AssertionError('Fixture unexpectedly allowed unsigned S3 access')
          except urllib.error.HTTPError as error:
              assert error.code in (401, 403), 'Fixture must enforce S3 authentication'
          PY
      - name: Verify optional S3 over real HTTP
        run: python -m pytest backend/tests/test_storage/test_s3_http.py -q --junitxml=test-results/s3-http.xml
      - name: Preserve protocol fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optional-s3-http-evidence
          path: |
            test-results/s3-image.json
            test-results/s3-http.xml
          if-no-files-found: warn
          retention-days: 7
  docker-runtime:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      IC_SUPABASE_URL: https://fixture.supabase.co
      IC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_synthetic_fixture
      IC_DESKTOP_ACCEPTANCE: "1"
      IC_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Assemble the exact installed runtime sources
        run: node desktop/scripts/prepare-runtime.cjs
      - name: Exercise the owned Docker stack and retained data
        run: node desktop/scripts/test-docker-runtime.cjs
      - name: Preserve runtime acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-docker-runtime-evidence
          path: desktop/runtime-acceptance.json
          if-no-files-found: warn
          retention-days: 1
