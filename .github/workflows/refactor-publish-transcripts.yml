name: Publish verified transcript correction batch
on:
  push:
    branches: [refactor/product-runtime-convergence]
    paths: [.github/workflows/refactor-publish-transcripts.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'studyzhige-ui/Interview_Copilot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify exact source edits and checkpoint on the existing branch
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^)" = 'a3d8b626a09070fd0bd672e6e1026632375b05f2'
          python - <<'PY'
          import base64, hashlib, json, subprocess, zlib
          from pathlib import Path, PurePosixPath
          root = Path.cwd()
          encoded = ''.join((root / '.refactor-transfer-p4' / f'part-{i}.txt').read_text() for i in range(4))
          if len(encoded) != 14476:
              raise SystemExit('Unexpected source transfer size')
          decoder = zlib.decompressobj()
          raw = decoder.decompress(base64.b64decode(encoded, validate=True), 100000)
          if not decoder.eof or decoder.unused_data or decoder.unconsumed_tail or len(raw) != 41770 or hashlib.sha256(raw).hexdigest() != '200c614c1c1760135c00db5add9f7f93f54da458abe4ab59224e615f99cbc77a':
              raise SystemExit('Source manifest digest mismatch')
          operations = json.loads(raw)
          if not isinstance(operations, dict) or len(operations) != 15:
              raise SystemExit('Unexpected source change count')
          prepared = []
          for name, (before_hash, after_hash, edits) in operations.items():
              relative = PurePosixPath(name)
              if relative.is_absolute() or '..' in relative.parts or relative.parts[0] not in {'backend', 'alembic'}:
                  raise SystemExit('Unsafe source path')
              path = root.joinpath(*relative.parts)
              if any(p.is_symlink() for p in (path, *path.parents)):
                  raise SystemExit('Source replacement refuses symlinks')
              stored = subprocess.run(['git', 'show', 'HEAD:' + name], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
              before = stored.stdout if stored.returncode == 0 else None
              if (hashlib.sha256(before).hexdigest() if before is not None else None) != before_hash:
                  raise SystemExit('Git preimage mismatch: ' + name)
              lines = (before or b'').decode('utf-8').splitlines(keepends=True)
              upper = len(lines)
              for start, stop, replacement in reversed(edits):
                  if type(start) is not int or type(stop) is not int or not 0 <= start <= stop <= upper or not isinstance(replacement, str):
                      raise SystemExit('Invalid source edit')
                  lines[start:stop] = replacement.splitlines(keepends=True)
                  upper = start
              after = ''.join(lines).encode('utf-8') if after_hash is not None else None
              if (hashlib.sha256(after).hexdigest() if after is not None else None) != after_hash:
                  raise SystemExit('Postimage mismatch: ' + name)
              prepared.append((path, after))
          for path, after in prepared:
              if after is None:
                  path.unlink()
              else:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(after)
          subprocess.run(['git', 'add', '--', *operations], check=True)
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          if set(filter(None, changed)) != set(operations):
              raise SystemExit('Staged files differ from manifest')
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          print('Verified 15 source edits. No project code, models or migrations executed.')
          PY
          branch='refactor/product-runtime-convergence'
          test "$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: version transcript corrections and invalidate derived interview judgments' -m 'Immutable acoustic evidence, user-confirmed roles, scoped history and read-only receipts. Shared invalidation archives prior review and retires stale knowledge. Focused 162 tests passed; fresh PostgreSQL CI remains required.'
          git push origin "HEAD:refs/heads/$branch"
          printf 'Published source commit: %s\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
