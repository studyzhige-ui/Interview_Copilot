name: Verify migration fixture source
on:
  push:
    branches: [refactor/product-runtime-convergence]
    paths: [.github/workflows/refactor-migration-contract.yml]
permissions:
  contents: write
jobs:
  fixture:
    if: github.repository == 'studyzhige-ui/Interview_Copilot' && github.ref == 'refs/heads/refactor/product-runtime-convergence'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Validate only the exact migration test correction, without moving any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request
          from pathlib import Path
          path = Path('backend/tests/test_db/test_alembic_migrations.py')
          raw = path.read_bytes()
          assert hashlib.sha256(raw).hexdigest() == '5d19a4a1a0e4c88c6e23615f28d64cf497283299e3451506fd7a698f5fd499ca'
          text = raw.decode()
          edits = [
              ('from sqlalchemy import Float, create_engine, inspect', 'from sqlalchemy import Float, Integer, create_engine, inspect'),
              ('    assert runtime_columns["target_question_count"]["nullable"] is False\n    assert set(runtime_columns) == {', '    assert runtime_columns["target_question_count"]["nullable"] is False\n    assert isinstance(runtime_columns["answer_claim_generation"]["type"], Integer)\n    assert runtime_columns["answer_claim_generation"]["nullable"] is False\n    assert runtime_columns["answer_claim_generation"]["default"] in {\n        "0",\n        "\'0\'::integer",\n    }\n    assert set(runtime_columns) == {'),
              ('        "answer_claimed_at",\n        "last_activity_at",', '        "answer_claimed_at",\n        "answer_claim_generation",\n        "last_activity_at",'),
          ]
          for before, after in edits:
              assert text.count(before) == 1
              text = text.replace(before, after)
          result = text.encode()
          assert hashlib.sha256(result).hexdigest() == '15451af51a990bc6efe7722100a43709c6b3e49d449e3ed02a287926b3f77bcd'
          compile(text, str(path), 'exec')
          request = urllib.request.Request(
              'https://api.github.com/repos/studyzhige-ui/Interview_Copilot/git/blobs',
              data=json.dumps({'content':base64.b64encode(result).decode(),'encoding':'base64'}).encode(),
              method='POST',
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              blob = json.load(response)
          assert blob['sha'] == '628d9b968b5f08b000ac73b542dfb5b83160cf51'
          print('Verified fixture blob:', blob['sha'])
          print('No branch or database modified by this workflow.')
          PY
