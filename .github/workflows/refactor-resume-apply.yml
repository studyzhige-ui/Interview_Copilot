name: Publish verified continuation

on:
  push:
    branches: [refactor/product-runtime-convergence]
    paths: [.github/workflows/refactor-resume-apply.yml]

permissions:
  contents: write

concurrency:
  group: publish-verified-refactor
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'studyzhige-ui/Interview_Copilot' && github.ref == 'refs/heads/refactor/product-runtime-convergence'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pinned source checker
        run: python -m pip install ruff==0.16.2
      - name: Validate and apply the exact tested source edits
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 562c4b1bcaeeac36303142d0c3d34c586213e52f HEAD
          git fetch origin refs/heads/refactor/product-runtime-convergence
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path
          hashes = {
              '01': '49ccdc28e4825fc25bdd5be19411748bb59f127add4e581213d6b10c84d1531c',
              '02': 'f9e602cbf8c207d078fcf538fc1a5a86883b3fcaba53b65a15b9bfa0f6f733fc',
              '03': '243e7885d9a8bf512d95721c51fc88a12a8e18a2e14cf7ebbcec1fb4b033d8c4',
              '04': '3229d9962f8e5d07256c3a4d2d44e4b06308097246b10f1dbc39a38e13666687',
              '05': '7d47d9e1cd698886c65c11aaef250aa93e548243523f84d1d2e8cee8856da80f',
              '06': '5e7c5d83dd3d2ba664fa71de573d172abdf6b66dde16c635f06fa5c553469239',
              '07': 'efae2c0066c17ee55d964934fbbfcaea7e35c8f6ed42ec02598e5421fa34c6e1',
              '08': '10f4664bf065029794e16272810e8c474beb8c37f8a873491daf860b1dc3e4d7',
              '09': 'd3c22060b3bf58aec3b9a4a407eaf1a8a7a11b53efc6c943d137db7753b29c1a',
              '10': 'f919a535c9b63522b78c5abb267eec9b64d4d3b8f6ef316d400f24f46b93b82c',
              '11': 'b499f8e515c5f95efa70ee158534c70d88e3eab4dbf4707a0e886083f45bbc72',
              '12': '2e1b22c1157a2c35bec7f289373f38f0f235ebc1859b7f62d455f3a0ff3306a1',
              '13': '0ee61d9f1ea8311959d6c6ec971d6d8f466b81092e51fb5486f0ae8b93f1b2e2',
              '14': '583251f110528bee06600547c051bf27f798ada32c0f402212ab6737746d79d5',
              '15': '68f12887cc7ecb61c4b4904f2fc9b989a1df9338d5b7a86057e487b5df69db3f',
              '16': 'ba7c92e3e47ee4e73e484f6787203c3390a8f4d33f9b11b33027b0f0275512c1',
              '17': 'c0e69a58029745db75c3d6fba2645b5076fe09e4eafc9f6b3a06ad7d517690cf',
          }
          allowed = {f'.refactor-resume/{part}.json' for part in hashes}
          allowed.add('.github/workflows/refactor-resume-apply.yml')
          changed = subprocess.check_output([
              'git', 'diff', '--name-only',
              '562c4b1bcaeeac36303142d0c3d34c586213e52f', 'HEAD',
          ]).decode().splitlines()
          assert set(changed) == allowed, 'unexpected concurrent source changes'
          pending = {}
          for part, digest in hashes.items():
              raw = Path(f'.refactor-resume/{part}.json').read_bytes()
              assert hashlib.sha256(raw).hexdigest() == digest, ('transport mismatch', part)
              for name, before_hash, after_hash, edits in json.loads(raw):
                  path = Path(name)
                  assert not path.is_absolute() and not {'.git', '..'} & set(path.parts)
                  assert all(not p.is_symlink() for p in [path, *path.parents])
                  assert name not in pending, ('duplicate path', name)
                  before = path.read_bytes() if path.exists() else b''
                  assert hashlib.sha256(before).hexdigest() == before_hash, ('baseline mismatch', name)
                  if after_hash is None:
                      assert edits is None and path.is_file()
                      pending[name] = None
                      continue
                  lines = before.decode('utf-8').splitlines(keepends=True)
                  end = len(lines)
                  for start, stop, text in reversed(edits):
                      assert 0 <= start <= stop <= end, ('invalid edit', name)
                      lines[start:stop] = [text]
                      end = start
                  after = ''.join(lines).encode('utf-8')
                  assert hashlib.sha256(after).hexdigest() == after_hash, ('target mismatch', name)
                  pending[name] = after
          assert len(pending) == 55
          for name, after in pending.items():
              path = Path(name)
              if after is None:
                  path.unlink()
              else:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(after)
          print('Verified and applied 55 exact source changes; no production services accessed.')
          PY
          ruff format --check backend/app backend/tests evaluation scripts
          ruff check backend/app backend/tests evaluation scripts
          python -m compileall -q backend/app evaluation scripts
      - name: Remove transport and publish only the tested source tree
        run: |
          set -euo pipefail
          git rm -r .refactor-resume .github/workflows/refactor-resume-apply.yml
          git add -A
          test "$(git write-tree)" = 'de79f07dd79860e211df07fcb458493e3ef997cb'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: persist primary model allowances and recover invitation commands across crashes' -m 'Continue the isolated refactor with Gmail invitation cutover, exact user decision binding, usage/stream safety, and required PostgreSQL regression tests. All source bytes verified against the locally tested tree. Product/live-quality gates remain open; no main or production data changes.'
          git push origin HEAD:refs/heads/refactor/product-runtime-convergence
