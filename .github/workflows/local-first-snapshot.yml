name: Local-first source snapshot
on:
  push:
    branches: [refactor/product-runtime-convergence]
    paths: [.github/workflows/local-first-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: |
          mkdir -p "$RUNNER_TEMP/source-snapshot"
          git archive HEAD > "$RUNNER_TEMP/source-snapshot/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/source-snapshot/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/source-snapshot/tree.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: local-first-source
          path: ${{ runner.temp }}/source-snapshot
          retention-days: 1
          if-no-files-found: error
