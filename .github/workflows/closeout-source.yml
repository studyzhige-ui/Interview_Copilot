name: Closeout source snapshot
on:
  push:
    branches: [refactor/product-runtime-convergence]
    paths: [.github/workflows/closeout-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Export tracked code only
        run: |
          git archive --format=tar HEAD > "$RUNNER_TEMP/closeout-source.tar"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/closeout-identity.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: closeout-source
          path: |
            ${{ runner.temp }}/closeout-source.tar
            ${{ runner.temp }}/closeout-identity.txt
          retention-days: 1
          if-no-files-found: error
