name: Closeout source snapshot
on:
  push:
    branches: [refactor/product-runtime-convergence]
    paths: [.github/workflows/closeout-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Prepare public development dependencies only
        run: |
          mkdir -p "$RUNNER_TEMP/contract-codegen"
          cd "$RUNNER_TEMP/contract-codegen"
          printf '%s\n' '{"name":"copilot-contract-codegen","version":"1.0.0","private":true,"type":"module","devDependencies":{"openapi-typescript":"7.13.0","typescript":"5.9.3"}}' > package.json
          npm install --ignore-scripts --no-audit --no-fund
          tar -czf "$RUNNER_TEMP/contract-codegen.tar.gz" package.json package-lock.json node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: contract-codegen
          path: ${{ runner.temp }}/contract-codegen.tar.gz
          retention-days: 1
          if-no-files-found: error
