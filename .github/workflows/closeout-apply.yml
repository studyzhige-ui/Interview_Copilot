name: Apply verified closeout tree
on:
  push:
    branches: [refactor/product-runtime-convergence]
    paths: [.github/workflows/closeout-apply.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'studyzhige-ui/Interview_Copilot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify baseline, payload and exact locally tested tree
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib, shutil, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          base = '6bf4d1e306b03d593cb0c59293d6ae5334a18d9e'
          tree = '00b28e0175fd23124016a256ceb0a2ffa3530141'
          target = 'ab6c0ebb610607793a3b20fc421a9dc97a1b9f98'
          assert git('rev-parse', 'HEAD^') == base
          assert git('rev-parse', base + '^{tree}') == tree
          root = pathlib.Path('.closeout-transfer')
          expected = [f'{i:02}.txt' for i in range(1, 10)]
          assert sorted(p.name for p in root.iterdir()) == expected
          encoded = ''.join((root / name).read_text('ascii') for name in expected)
          assert len(encoded) == 56240
          compressed = base64.b64decode(encoded, validate=True)
          assert len(compressed) == 42180
          decoder = lzma.LZMADecompressor(memlimit=256 * 1024 * 1024)
          raw = decoder.decompress(compressed, max_length=284312)
          assert decoder.eof and not decoder.unused_data and len(raw) == 284311
          assert hashlib.sha256(raw).hexdigest() == '33280d3bf3dc5fd97176ee73e277af619805a3cb118d416859522a011881789f'
          payload = json.loads(raw)
          assert payload['base_commit'] == base and payload['base_tree'] == tree
          assert payload['expected_tree'] == target and len(payload['paths']) == 33
          for name in payload['paths']:
              p = pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert name.startswith(('backend/', 'frontend/', 'docs/', 'scripts/')) or name in {'.gitignore', '.github/workflows/ci.yml', '.github/workflows/closeout-source.yml'}
          patch = payload['patch'].encode('utf-8')
          subprocess.run(['git', 'apply', '--index', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          shutil.rmtree(root)
          pathlib.Path('.github/workflows/closeout-apply.yml').unlink()
          subprocess.run(['git', 'add', '-A'], check=True)
          assert git('write-tree') == target
          assert not pathlib.Path('.github/workflows/closeout-source.yml').exists()
          print('Exact tested source tree verified:', target)
          PY
      - name: Publish only to the existing draft branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: close accounting recovery, legacy owner and shared protocol contracts'
          git push origin HEAD:refs/heads/refactor/product-runtime-convergence
