name: Refactor resume source snapshot
on:
  push:
    branches: [refactor/product-runtime-convergence]
    paths: [.github/workflows/refactor-resume-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Export tracked files only, without credentials or runtime data
        run: |
          mkdir -p "$RUNNER_TEMP/refactor-source"
          git archive HEAD > "$RUNNER_TEMP/refactor-source/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/refactor-source/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/refactor-source/tree.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: refactor-resume-source
          path: ${{ runner.temp }}/refactor-source/
          retention-days: 1
          if-no-files-found: error
