name: Publish verified refactor tree

on:
  push:
    branches: [refactor/product-runtime-convergence]
    paths: [.github/workflows/refactor-apply.yml]

permissions:
  contents: write

concurrency:
  group: publish-verified-refactor
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'studyzhige-ui/Interview_Copilot' && github.ref == 'refs/heads/refactor/product-runtime-convergence'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install the existing pinned formatter
        run: python -m pip install ruff==0.16.2
      - name: Validate baseline and exact tested file contents
        run: |
          set -euo pipefail
          git merge-base --is-ancestor cdc0a85ed92a557b8dfb5d7aea1ceb5b785e565e HEAD
          ruff format backend/app backend/tests evaluation scripts
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          hashes = {
              '01.json': 'd36cc09385807e82239275344af24fef2d0ebd8935b08919ab866924df4f39a8',
              '02.json': '8aefdfb90f867fc6471ac76b50154add96bc4154760d076faa53577bf0fdd881',
              '03.json': '2af1c8c0d3fd6f18af2ac5a6f358d75d4463432660567e351dea31f474df2100',
              '04.json': '5a1c010df5af7f2e134b6992855225218c7aec62d381bfc18e378656baf7c7ee',
              '05.json': '4ee3d8a2b7d8fdef48acaeb422881f35a6b2946350420ef6abb145b9e620f222',
              '06.json': '2aaed91cca06da0aec8eab3fcb85ce4420e17085551c9312b546075ff9f507c9',
              '07.json': 'fa47c8b677031ca42d62179f48559e1db61aa7580b205874027dba083e62db89',
              '08.json': 'b68fa21a6c740c7a1fafc862fba76ddddcf4d5aa5645b4ffe0cc7bacd4ffe50e',
              '09.json': '9ca6700bc526036f999577a8175d952c654cff9b3051091f7076418a8e8a558c',
              '10.json': '04788c782420f959347ef8a0f4c711dd2296c3f7cf9e91e20efb8e13b277d129',
          }
          pending = {}
          for part, digest in hashes.items():
              raw = (Path('.refactor') / part).read_bytes()
              assert hashlib.sha256(raw).hexdigest() == digest, ('transport mismatch', part)
              for name, before_hash, after_hash, edits in json.loads(raw):
                  path = Path(name)
                  assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
                  assert name not in pending, ('duplicate path', name)
                  before = path.read_text() if path.exists() else ''
                  assert hashlib.sha256(before.encode()).hexdigest() == before_hash, ('baseline mismatch', name)
                  lines = before.splitlines(keepends=True)
                  end = len(lines)
                  for start, stop, text in reversed(edits):
                      assert 0 <= start <= stop <= end, ('invalid edit', name)
                      lines[start:stop] = [text]
                      end = start
                  after = ''.join(lines)
                  assert hashlib.sha256(after.encode()).hexdigest() == after_hash, ('target mismatch', name)
                  pending[name] = after
          assert len(pending) == 74
          for name, after in pending.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(after)
          print('Verified and applied 74 source changes; existing formatter handles 13 format-only files.')
          PY
          ruff format --check backend/app backend/tests evaluation scripts
          ruff check backend/app backend/tests evaluation scripts
          python -m compileall -q backend/app evaluation scripts
      - name: Remove temporary transport and commit only the tested tree
        run: |
          set -euo pipefail
          git rm -r .refactor .github/workflows/refactor-workspace.yml .github/workflows/refactor-apply.yml
          git add -A
          actual_tree=$(git write-tree)
          test "$actual_tree" = 'a54badc5623a1c63638cf6aa6fd1a94bd6ba5eb6'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: integrate product Copilot and harden runtime, RAG, and preparation contracts' -m 'Source tree verified against isolated backend and frontend regression tests. Full product release gates remain open in the existing implementation ledger. No production data changed.'
          git push origin HEAD:refs/heads/refactor/product-runtime-convergence
