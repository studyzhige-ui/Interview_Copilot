name: Engineering source snapshot
on:
  push:
    branches: [refactor/product-runtime-convergence]
    paths: [.github/workflows/engineering-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: git archive --format=tar HEAD > "${RUNNER_TEMP}/source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: engineering-source
          path: ${{ runner.temp }}/source.tar
          retention-days: 1
