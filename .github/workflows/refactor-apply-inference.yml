name: Publish verified isolated local inference
on:
  push:
    branches: [refactor/product-runtime-convergence]
    paths: [.github/workflows/refactor-apply-inference.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'studyzhige-ui/Interview_Copilot' && github.ref == 'refs/heads/refactor/product-runtime-convergence'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify complete source changes without executing application code
        env:
          EXPECTED_EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_EVENT_SHA"
          test "$(git rev-parse HEAD^)" = '8cd605c571ea71f271ed05a0f63bed3468033be3'
          python - <<'PY'
          import base64, bz2, hashlib, json, subprocess
          from pathlib import Path, PurePosixPath
          root = Path.cwd()
          encoded = b''.join((root / '.refactor-inference-transfer' / f'part-{i:02}.txt').read_bytes() for i in range(5))
          if len(encoded) != 32728:
              raise SystemExit('Transport size mismatch')
          payload = base64.b64decode(encoded, validate=True)
          if len(payload) != 24546 or hashlib.sha256(payload).hexdigest() != 'cc35dade928f12880a3c3ab97559dac1490eb616bd894ee4c02ef9b3f57232b4':
              raise SystemExit('Transport digest mismatch')
          decoder = bz2.BZ2Decompressor()
          raw = decoder.decompress(payload, max_length=200000)
          if not decoder.eof or decoder.unused_data or len(raw) != 102383 or hashlib.sha256(raw).hexdigest() != '263de17e95383ebe3edeb08aff907b0639af9be658b4921b1fc742bb2e1f8f28':
              raise SystemExit('Manifest digest mismatch')
          operations = json.loads(raw)
          if not isinstance(operations, dict) or len(operations) != 28:
              raise SystemExit('Unexpected change count')
          prepared = []
          for name, (before_hash, after_hash, edits) in operations.items():
              relative = PurePosixPath(name)
              if relative.is_absolute() or '..' in relative.parts or (relative.parts[0] not in {'backend', 'scripts', 'docs'} and name not in {'.env.local-first.example', 'pyproject.toml'}):
                  raise SystemExit('Unsafe source path')
              path = root.joinpath(*relative.parts)
              if any(p.is_symlink() for p in (path, *path.parents)):
                  raise SystemExit('Source replacement refuses symbolic links')
              stored = subprocess.run(['git', 'show', 'HEAD:' + name], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
              before = stored.stdout if stored.returncode == 0 else None
              if (hashlib.sha256(before).hexdigest() if before is not None else None) != before_hash:
                  raise SystemExit('Preimage mismatch: ' + name)
              lines = (before or b'').decode('utf-8').splitlines(keepends=True)
              upper = len(lines)
              for start, stop, replacement in reversed(edits):
                  if type(start) is not int or type(stop) is not int or not 0 <= start <= stop <= upper or not isinstance(replacement, str):
                      raise SystemExit('Invalid source edit')
                  lines[start:stop] = replacement.splitlines(keepends=True)
                  upper = start
              result = ''.join(lines).encode('utf-8') if after_hash is not None else None
              if (hashlib.sha256(result).hexdigest() if result is not None else None) != after_hash:
                  raise SystemExit('Postimage mismatch: ' + name)
              prepared.append((path, result))
          for path, result in prepared:
              if result is None:
                  path.unlink()
              else:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(result)
          subprocess.run(['git', 'add', '--', *operations], check=True)
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          if set(filter(None, changed)) != set(operations):
              raise SystemExit('Staged paths differ from manifest')
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          print('Verified exactly 28 source changes. No application, model or migration executed.')
          PY
      - name: Commit only to the existing branch without force
        env:
          EXPECTED_EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch='refactor/product-runtime-convergence'
          test "$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_EVENT_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: isolate local RAG inference in a bounded shared model broker' -m 'Single-owner Unix broker, separate selected ML interpreters, explicit model bindings, resident reuse, priority aging and bounded admission, fail-closed outcomes, cancellation cleanup and parent-death worker termination. Connect actual embedding/reranker factories and metering. Add 59 regressions and installation diagnostics. ASR/TTS/GPU quality and full P2-P9 completion are not claimed.'
          git push origin "HEAD:refs/heads/$branch"
          printf 'Published commit: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
