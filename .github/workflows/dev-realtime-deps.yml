name: Temporary realtime dependency preparation
on:
  push:
    branches: [dev/source-export-20260921]
    paths: [.github/workflows/dev-realtime-deps.yml]
permissions:
  contents: read
jobs:
  wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Prepare WebRTC wheels only
        run: |
          set -euo pipefail
          mkdir -p /tmp/realtime-wheels
          python -m pip download --only-binary=:all: --dest /tmp/realtime-wheels 'aiortc==1.15.0' 'av>=17,<18'
          cd /tmp/realtime-wheels
          sha256sum *.whl > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: realtime-validation-wheels
          path: /tmp/realtime-wheels
          retention-days: 1
          if-no-files-found: error
