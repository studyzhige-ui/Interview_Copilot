name: Temporary atomic refactor preparation

on:
  pull_request:
    branches: [main]
    types: [edited]

permissions:
  contents: write

concurrency:
  group: refactor-batch-preparation
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.pull_request.number == 2 &&
      github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'refactor/product-runtime-convergence' &&
      github.actor == 'studyzhige-ui' &&
      contains(github.event.pull_request.title, '[prepare:')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install repository-pinned formatter
        run: python -m pip install ruff==0.16.2
      - name: Validate batch and create unreferenced commit without moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, re, subprocess, urllib.request, zlib
          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          match = re.search(r'\[prepare:([0-9a-f]{40})\]', event['pull_request']['title'])
          if match is None:
              raise SystemExit('missing immutable preparation input')
          repo = os.environ['GITHUB_REPOSITORY']
          api = 'https://api.github.com/repos/' + repo
          def request(path, payload=None):
              req = urllib.request.Request(
                  api + path,
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json'},
                  method='GET' if payload is None else 'POST')
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          def git(*args, data=None):
              return subprocess.check_output(['git', *args], input=data)
          blob = request('/git/blobs/' + match.group(1))
          raw = base64.b64decode(blob['content'])
          if len(raw) > 200_000:
              raise SystemExit('preparation input too large')
          plan = json.loads(raw)
          if set(plan) != {'schema', 'base_sha', 'message', 'patch_parts', 'patch_sha256'} or plan['schema'] != 2:
              raise SystemExit('invalid preparation schema')
          parts = plan['patch_parts']
          if not isinstance(parts, list) or not 1 <= len(parts) <= 32 or any(not isinstance(p, str) or not re.fullmatch(r'[0-9a-f]{40}', p) for p in parts):
              raise SystemExit('invalid patch part identities')
          encoded = bytearray()
          for part in parts:
              content = base64.b64decode(request('/git/blobs/' + part)['content'])
              if len(content) > 20_000 or len(encoded) + len(content) > 200_000:
                  raise SystemExit('patch part capacity')
              encoded.extend(content)
          base = event['pull_request']['head']['sha']
          if plan['base_sha'] != base or git('rev-parse', 'HEAD').decode().strip() != base:
              raise SystemExit('preparation base mismatch')
          ref = request('/git/ref/heads/refactor/product-runtime-convergence')
          if ref['object']['sha'] != base:
              raise SystemExit('branch advanced before preparation')
          dec = zlib.decompressobj()
          patch = dec.decompress(base64.b64decode(encoded, validate=True), 2_000_001)
          if len(patch) > 2_000_000 or not dec.eof or dec.unused_data or dec.unconsumed_tail:
              raise SystemExit('invalid bounded patch envelope')
          if hashlib.sha256(patch).hexdigest() != plan['patch_sha256']:
              raise SystemExit('patch checksum mismatch')
          git('apply', '--index', '--whitespace=error', '-', data=patch)
          names = [p for p in git('diff', '--cached', '--name-only', '-z').decode().split('\0') if p]
          if not 0 < len(names) <= 80 or any(p.startswith('/') or '..' in pathlib.PurePosixPath(p).parts for p in names):
              raise SystemExit('invalid batch paths')
          python_paths = [p for p in names if p.endswith('.py') and pathlib.Path(p).is_file()]
          if python_paths:
              subprocess.run(['ruff', 'format', '--', *python_paths], check=True)
          git('add', '-u')
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'prepared'
          output.mkdir(exist_ok=True)
          canonical_patch = git('diff', '--cached', '--binary', '--full-index')
          (output / 'prepared.patch').write_bytes(canonical_patch)
          subprocess.run(['ruff', 'format', '--check', 'backend/app', 'backend/tests', 'evaluation', 'scripts'], check=True)
          subprocess.run(['ruff', 'check', 'backend/app', 'backend/tests', 'evaluation', 'scripts'], check=True)
          subprocess.run(['python', '-m', 'compileall', '-q', 'backend/app', 'backend/tests', 'evaluation', 'scripts'], check=True)
          git('diff', '--cached', '--check')
          entries = []
          for name in names:
              entry = git('ls-files', '--stage', '-z', '--', name)
              if not entry:
                  entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              metadata = entry.split(b'\t', 1)[0].decode().split()
              mode, local_sha, stage = metadata
              if stage != '0' or mode not in {'100644', '100755', '120000'}:
                  raise SystemExit('unsupported index entry')
              content = git('cat-file', 'blob', local_sha)
              remote = request('/git/blobs', {'content': base64.b64encode(content).decode(), 'encoding': 'base64'})
              if remote['sha'] != local_sha:
                  raise SystemExit('blob identity mismatch')
              entries.append({'path': name, 'mode': mode, 'type': 'blob', 'sha': local_sha})
          base_tree = request('/git/commits/' + base)['tree']['sha']
          tree = request('/git/trees', {'base_tree': base_tree, 'tree': entries})
          if tree['sha'] != git('write-tree').decode().strip():
              raise SystemExit('tree identity mismatch')
          commit = request('/git/commits', {'message': plan['message'], 'tree': tree['sha'], 'parents': [base]})
          (output / 'commit.json').write_text(json.dumps({
              'base_sha': base, 'tree_sha': tree['sha'], 'commit_sha': commit['sha'],
              'changed_paths': names, 'canonical_patch_sha256': hashlib.sha256(canonical_patch).hexdigest(),
              'checks': ['ruff-format', 'ruff-check', 'compileall', 'git-diff-check'],
              'branch_updated': False}, indent=2))
      - name: Preserve small offline development tools
        run: |
          python -m pip download --no-deps --only-binary=:all: ruff==0.16.2 pgvector==0.5.0 -d "$RUNNER_TEMP/prepared/wheels"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-refactor-batch
          path: ${{ runner.temp }}/prepared/
          if-no-files-found: warn
          retention-days: 1
