name: Refactor source transfer
on:
  push:
    branches: [refactor/product-runtime-convergence]
    paths: [.github/workflows/refactor-source-transfer.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Export only committed source
        run: |
          mkdir -p "$RUNNER_TEMP/refactor-source"
          git archive --format=tar HEAD > "$RUNNER_TEMP/refactor-source/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/refactor-source/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/refactor-source/tree.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/refactor-source/entries.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: refactor-source
          path: ${{ runner.temp }}/refactor-source/
          retention-days: 1
          if-no-files-found: error
