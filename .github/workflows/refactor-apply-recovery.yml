name: Recover verified refactor source
on:
  push:
    branches: [refactor/product-runtime-convergence]
    paths:
      - .github/workflows/refactor-apply-recovery.yml
      - .refactor-transfer/**
permissions:
  contents: write
concurrency:
  group: refactor-recovery-only
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'studyzhige-ui/Interview_Copilot' && github.ref == 'refs/heads/refactor/product-runtime-convergence'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify exact recovery bytes and apply without executing source
        shell: bash
        env:
          EXPECTED_EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_EVENT_SHA"
          test "$(git rev-parse HEAD^)" = '60a733af3101a24d9c8df2501f02fce1709ea383'
          python - <<'PY'
          import bz2, hashlib, json, os, subprocess
          from pathlib import Path, PurePosixPath
          root = Path.cwd()
          payload = b''.join((root / '.refactor-transfer' / ('part-' + name + '.bin')).read_bytes() for name in ('00', '01', '02', '03a', '03b', '04'))
          if len(payload) != 44053 or hashlib.sha256(payload).hexdigest() != '5e8d9b4ed531a729bda8fd56a62de1c7039891d96b6f83bbe8c3d11549355ffb':
              raise SystemExit('Recovery transport digest mismatch')
          decoder = bz2.BZ2Decompressor()
          raw = decoder.decompress(payload, max_length=200000)
          if not decoder.eof or decoder.unused_data or len(raw) != 179441 or hashlib.sha256(raw).hexdigest() != 'b9d882ff79ed546dcee32c9bf45f46a43951898d2c4afe88109e1bd822f688bd':
              raise SystemExit('Recovery manifest digest mismatch')
          operations = json.loads(raw)
          if not isinstance(operations, dict) or len(operations) != 87:
              raise SystemExit('Unexpected recovery change count')
          prepared = []
          for name, (before_hash, after_hash, edits) in operations.items():
              relative = PurePosixPath(name)
              if relative.is_absolute() or '..' in relative.parts or relative.parts[0] not in {'alembic', 'backend', 'docs', 'evaluation', 'frontend', 'scripts'}:
                  raise SystemExit('Unsafe recovery path')
              path = root.joinpath(*relative.parts)
              if any(p.is_symlink() for p in (path, *path.parents)):
                  raise SystemExit('Recovery refuses symbolic links')
              before = path.read_bytes() if path.exists() else None
              actual = hashlib.sha256(before).hexdigest() if before is not None else None
              if actual != before_hash:
                  raise SystemExit('Recovery preimage mismatch: ' + name)
              lines = (before or b'').decode('utf-8').splitlines(keepends=True)
              upper = len(lines)
              for start, stop, replacement in reversed(edits):
                  if type(start) is not int or type(stop) is not int or not 0 <= start <= stop <= upper or not isinstance(replacement, str):
                      raise SystemExit('Invalid recovery edit')
                  lines[start:stop] = replacement.splitlines(keepends=True)
                  upper = start
              result = ''.join(lines).encode('utf-8') if after_hash is not None else None
              if (hashlib.sha256(result).hexdigest() if result is not None else None) != after_hash:
                  raise SystemExit('Recovery postimage mismatch: ' + name)
              prepared.append((path, result))
          for path, result in prepared:
              if result is None:
                  path.unlink()
              else:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(result)
          subprocess.run(['git', 'add', '--', *operations], check=True)
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          if set(filter(None, changed)) != set(operations):
              raise SystemExit('Staged paths differ from the verified manifest')
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          print('Verified and staged exactly 87 source changes; no project code executed.')
          PY
      - name: Commit only on the existing refactor branch
        shell: bash
        env:
          EXPECTED_EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch='refactor/product-runtime-convergence'
          remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
          test "$remote_sha" = "$EXPECTED_EVENT_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: unify ten-point scoring, interview purposes and versioned review corrections' -m 'Recover 87 hash-verified source changes previously validated in the isolated environment. Includes score10-v1, interview purposes, evidence-based rubric, correction history and generation fences. Requires fresh PostgreSQL and browser CI; real models and full P2-P9 completion are not claimed.'
          git push origin "HEAD:refs/heads/$branch"
          printf 'Recovered commit: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
