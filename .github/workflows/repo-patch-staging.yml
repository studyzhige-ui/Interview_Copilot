name: Temporary fixed-patch integration
on:
  push:
    branches: [refactor/product-runtime-convergence]
    paths: [.github/workflows/repo-patch-staging.yml]
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'studyzhige-ui/Interview_Copilot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg15-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interview_copilot
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:8.10.0-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/interview_copilot
      REQUIRE_TEST_POSTGRES: '1'
      PYTHONPATH: backend
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEEPSEEK_API_KEY: test-key-not-real
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install repository dependencies only, never model weights
        run: |
          pip install -e '.[dev]'
          npm ci --prefix frontend
          npm ci --prefix scripts/contract_codegen --ignore-scripts --no-audit --no-fund
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Apply hash-checked fixed patches without changing any branch
        run: python .github/_stage/stage.py apply
      - name: Regenerate official contracts and freeze validation tree
        run: |
          python scripts/export_shared_contracts.py
          npm run --prefix scripts/contract_codegen generate
          npm run --prefix scripts/contract_codegen check
          python /tmp/copilot-stage/stage.py capture
      - name: Static and fixture gates
        run: |
          ruff format --check backend/app backend/tests evaluation scripts
          ruff check backend/app backend/tests evaluation scripts
          python -m compileall -q backend/app evaluation scripts
          python scripts/export_shared_contracts.py --check
          pytest backend/tests --setup-plan -q > /tmp/copilot-stage/fixture-plan.txt
          alembic upgrade head
          alembic check
      - name: Current-tree backend regressions with PostgreSQL and Redis
        run: pytest backend/tests --ignore=backend/tests/browser -q --tb=short --junitxml=/tmp/copilot-stage/backend.xml > /tmp/copilot-stage/backend.log 2>&1
      - name: Current-tree frontend gates
        run: |
          npm run --prefix frontend typecheck
          npm run --prefix frontend lint
          npm run --prefix frontend test:run > /tmp/copilot-stage/frontend.log 2>&1
          npm run --prefix frontend build
      - name: Publish immutable Git objects only, no branch update
        env:
          GH_TOKEN: ${{ github.token }}
        run: python /tmp/copilot-stage/stage.py publish
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fixed-patch-integration
          path: /tmp/copilot-stage
          retention-days: 2
          if-no-files-found: warn
