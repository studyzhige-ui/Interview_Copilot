name: Refactor source snapshot
on:
  push:
    branches: [refactor/product-runtime-convergence]
    paths: [.github/workflows/refactor-source-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'studyzhige-ui/Interview_Copilot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Export tracked source only
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: continuation-source
          path: ${{ runner.temp }}/source.tar
          retention-days: 1
