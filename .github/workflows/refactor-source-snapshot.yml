name: Refactor source snapshot

on:
  push:
    branches: [refactor/product-runtime-convergence]
    paths: [.github/workflows/refactor-source-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Archive tracked source without Git credentials or runtime files
        run: |
          mkdir -p source-snapshot
          git rev-parse HEAD > source-snapshot/commit.txt
          git archive --format=tar.gz HEAD > source-snapshot/repository.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: refactor-source-snapshot
          path: source-snapshot/
          if-no-files-found: error
          retention-days: 1
