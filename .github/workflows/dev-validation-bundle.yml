name: Temporary offline validation bundle

on:
  push:
    branches: [refactor/product-runtime-convergence]
    paths: [.github/workflows/dev-validation-bundle.yml]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Package pinned portable runtime validation dependencies
        run: |
          set -euo pipefail
          mkdir -p /tmp/copilot-validation/wheels
          python - <<'PY'
          import pathlib, tomllib
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']
          requirements = project['dependencies'] + project['optional-dependencies']['dev']
          pathlib.Path('/tmp/copilot-validation/requirements.txt').write_text('\n'.join(requirements))
          PY
          python -m pip download --only-binary=:all: --dest /tmp/copilot-validation/wheels -r /tmp/copilot-validation/requirements.txt
          test "$(du -sm /tmp/copilot-validation | cut -f1)" -lt 900
      - uses: actions/upload-artifact@v7
        with:
          name: offline-runtime-wheels
          path: /tmp/copilot-validation
          retention-days: 1
          if-no-files-found: error
