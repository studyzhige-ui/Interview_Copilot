name: Closeout source snapshot
on:
  push:
    branches: [refactor/product-runtime-convergence]
    paths: [.github/workflows/closeout-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          mkdir -p /tmp/closeout-source
          git archive --format=tar HEAD > /tmp/closeout-source/source.tar
          git rev-parse HEAD > /tmp/closeout-source/commit.txt
          git rev-parse HEAD^{tree} > /tmp/closeout-source/tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: closeout-source
          path: /tmp/closeout-source/
          retention-days: 1
