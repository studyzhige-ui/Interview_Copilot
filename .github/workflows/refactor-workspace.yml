name: Refactor workspace

on:
  push:
    branches: [refactor/product-runtime-convergence]
    paths: [.github/workflows/refactor-workspace.yml]

permissions:
  contents: read

jobs:
  tracked-source:
    if: github.repository == 'studyzhige-ui/Interview_Copilot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Export only tracked source
        run: git archive --format=tar HEAD > "${RUNNER_TEMP}/tracked-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: refactor-tracked-source
          path: ${{ runner.temp }}/tracked-source.tar
          retention-days: 1
