name: Refactor workspace

on:
  push:
    branches: [refactor/product-runtime-convergence]
    paths: [.github/workflows/refactor-workspace.yml]

permissions:
  contents: read

jobs:
  offline-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Build pinned wheelhouse (public packages only)
        run: |
          python -m pip wheel '.[dev]' --wheel-dir "${RUNNER_TEMP}/wheelhouse"
      - uses: actions/upload-artifact@v4
        with:
          name: refactor-wheelhouse-py313
          path: ${{ runner.temp }}/wheelhouse
          retention-days: 1
