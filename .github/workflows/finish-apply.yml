name: Publish verified closeout tree
on:
  push:
    branches: [refactor/product-runtime-convergence]
    paths: [.github/workflows/finish-apply.yml]
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'studyzhige-ui/Interview_Copilot' && github.ref == 'refs/heads/refactor/product-runtime-convergence'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Reproduce exact reviewed source and remove transfer files
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, subprocess
          base = '3dbdd42c103d940c113f9dc956b102ee50ccc800'
          target = '8be8f28f10a30dc6933eb5afbd526c807dbff1cd'
          helper = '.github/workflows/finish-apply.yml'
          parts = ['.finish-transfer/01.txt', '.finish-transfer/02.txt']
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD^') == base, 'unexpected baseline; stop'
          assert set(git('diff', '--name-only', base, 'HEAD').splitlines()) == {*parts, helper}
          encoded = ''.join(Path(p).read_text().strip() for p in parts)
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 29202
          assert hashlib.sha256(patch).hexdigest() == '76a79ed1b21edaff76023eab5468250d066c21098ead5c7ab3914e7d0d0645da'
          path = Path('/tmp/verified-closeout.patch')
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--unidiff-zero', '--index', '--whitespace=error', str(path)], check=True)
          subprocess.run(['git', 'rm', '--', helper, *parts], check=True)
          assert git('write-tree') == target, 'source differs from locally tested tree'
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix: preserve consumption stop signals through adapters and retrieval'], check=True)
          # Fast-forward only. A concurrent branch change must fail, never overwrite.
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/refactor/product-runtime-convergence'], check=True)
          PY
