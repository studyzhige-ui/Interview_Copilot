<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; frame-src 'none'"><title>Interview Copilot · 本地服务</title><link rel="stylesheet" href="style.css"></head><body><main><p class="eyebrow">INTERVIEW COPILOT</p><h1>你的本地工作区</h1><p>资料、录音和任务保存在这台电脑。账号登录由 Supabase 验证，模型服务按你的 BYOK 配置使用。</p><section><h2>本地服务</h2><p id="status" role="status" aria-live="polite">正在检查应用配置…</p><div class="buttons"><button id="check">检查 Docker Desktop</button><button id="start" class="primary">启动工作区</button><button id="open" hidden>打开应用</button><button id="stop" disabled>停止本地服务</button></div></section><p class="note">首次启动会构建服务镜像，可能需要较长时间。关闭界面后，Docker 中的任务仍可继续；停止服务会保留资料和数据库卷。应用不会安装 Docker、删除数据库或停止其他项目。</p><button id="guide" class="link">查看 Docker Desktop 的 Windows 安装说明</button></main><script src="renderer.js"></script></body></html>
